name = "sveltia-cms-auth"
main = "src/index.js"
compatibility_date = "2023-03-24"

# keep_vars stops `wrangler deploy` (run by Workers Builds) from deleting
# dashboard-managed vars/secrets on each build. Needed so the encrypted
# GITHUB_CLIENT_SECRET (set in the dashboard) survives every deploy.
keep_vars = true

# Non-secret config, version-controlled so it's reapplied on every build.
[vars]
ALLOWED_DOMAINS = "tegannorthwood-astro.pages.dev,tegannorthwood.com.au,www.tegannorthwood.com.au"
GITHUB_CLIENT_ID = "Ov23liyUBis9bryq41Pn"
